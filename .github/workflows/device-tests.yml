name: Device tests

# Started by hand from the Actions tab: the same tests run on the local emulator before each release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-tests:
    name: Device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Free disk space for the emulator
        # The runner starts with too little free disk for an emulator next to a Gradle build, so
        # toolchains this project never uses are removed.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its device tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload device test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          retention-days: 14
