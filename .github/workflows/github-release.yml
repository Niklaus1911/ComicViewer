name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-debug-apk:
    name: Release debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "ComicViewer-${GITHUB_REF_NAME}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Comic Viewer ${{ github.ref_name }}
          files: ComicViewer-${{ github.ref_name }}-debug.apk
          body: |
            This first release provides a debug APK for Comic Viewer.

            ⚠️ Debug APK warning: this APK is signed with a debug key. Future signed/release APKs may require uninstalling this debug APK before installing the release-signed version.

            Install note: Android may require allowing installs from unknown sources before installing this APK.

            Upgrade note: if a future release-signed APK cannot be installed over this debug APK, uninstall the debug APK first and then install the signed release APK.
