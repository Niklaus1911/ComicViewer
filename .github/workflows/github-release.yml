name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-debug-apk:
    name: Release debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "ComicViewer-${GITHUB_REF_NAME}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Comic Viewer ${{ github.ref_name }}
          files: ComicViewer-${{ github.ref_name }}-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            The Google Play version is the recommended way to install Comic Viewer. The attached APK is a debug build for testing.

            ⚠️ The debug APK is signed with a debug key, so it cannot be installed over the Play version. Uninstall one before installing the other; this removes the app's local library and settings.
