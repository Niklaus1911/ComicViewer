name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Write release notes
        # The notes are the version's section of CHANGELOG.md; the release fails without one.
        run: |
          {
            python3 scripts/changelog_section.py "$GITHUB_REF_NAME"
            echo
            echo "---"
            echo
            echo "Install Comic Viewer from [Google Play](https://play.google.com/store/apps/details?id=com.comicviewer)."
          } > release-notes.md
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Comic Viewer ${{ env.VERSION }}
          body_path: release-notes.md
